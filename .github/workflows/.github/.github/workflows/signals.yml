# ============================================================================
# FOCUS AUTO TRADERS - ALL-IN-ONE AUTOMATED SIGNAL BOT  (single file)
#
# SETUP (5 minutes):
#  1. Create a PRIVATE GitHub repo. Add a file at exactly this path:
#         .github/workflows/signals.yml
#     and paste this whole file into it. Commit.
#  2. Telegram: @BotFather -> /newbot -> copy the token. Send any message to your
#     bot, then open https://api.telegram.org/bot<TOKEN>/getUpdates -> copy chat.id
#  3. Repo -> Settings -> Secrets and variables -> Actions -> New repository secret:
#         TELEGRAM_TOKEN      and      TELEGRAM_CHAT_ID
#  4. Repo -> Settings -> Actions -> General -> Workflow permissions ->
#     "Read and write permissions" -> Save  (lets the bot save its state).
#  5. Actions tab -> "Signal Bot" -> Run workflow (tick "demo" to test without Deriv).
#
# Change the settings in the `env:` block below any time. Nothing else is needed.
# Signals are mechanical (EMA cross + RSI filter, ATR stop/target). Not advice, not
# backtested - test on a demo account first.
# ============================================================================
name: Signal Bot

on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub minimum is 5 min (best effort, may run a few min late)
  workflow_dispatch:
    inputs:
      demo:
        description: "Use synthetic demo candles (test mode)"
        type: boolean
        default: false

permissions:
  contents: write              # to save state.json (prevents duplicate alerts)

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # ---------------- SETTINGS (the "Settings sheet") ----------------
      SYMBOLS: "R_75"          # comma separated, e.g. "R_75,R_100,frxEURUSD"
      GRANULARITY: "300"       # seconds: 300 = 5m, 900 = 15m, 3600 = 1h
      CANDLES: "500"           # max 600
      EMA_FAST: "9"
      EMA_SLOW: "21"
      RSI_PERIOD: "14"
      ATR_PERIOD: "14"
      SL_ATR_MULT: "1.5"       # stop loss = ATR x this
      REWARD_RISK: "2"         # take profit = stop distance x this
      BUY_RSI_MIN: "50"
      BUY_RSI_MAX: "70"
      SELL_RSI_MIN: "30"
      SELL_RSI_MAX: "50"
      BALANCE: "1000"
      RISK_PCT: "0.01"         # 0.01 = 1% of balance per trade
      CATCH_UP: "3"            # re-check last N candles in case a run was late
      # ----------------------------------------------------------------
      DERIV_WS: "wss://ws.derivws.com/websockets/v3?app_id=1089"   # update if Deriv changes its API
      DEMO: ${{ inputs.demo && '1' || '0' }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run signal bot
        run: |
          node --input-type=module <<'BOT_EOF'
          import fs from "node:fs";
          const E = process.env, num = (k) => parseFloat(E[k]);
          const cfg = {
            symbols: E.SYMBOLS.split(",").map(s => s.trim()).filter(Boolean),
            gran: parseInt(E.GRANULARITY), count: Math.min(600, parseInt(E.CANDLES)),
            emaF: num("EMA_FAST"), emaS: num("EMA_SLOW"), rsiN: num("RSI_PERIOD"), atrN: num("ATR_PERIOD"),
            slM: num("SL_ATR_MULT"), rr: num("REWARD_RISK"),
            buyLo: num("BUY_RSI_MIN"), buyHi: num("BUY_RSI_MAX"), sellLo: num("SELL_RSI_MIN"), sellHi: num("SELL_RSI_MAX"),
            bal: num("BALANCE"), riskPct: num("RISK_PCT"), catchUp: parseInt(E.CATCH_UP),
          };
          const st = { ...cfg,
            aF: 2 / (cfg.emaF + 1), aS: 2 / (cfg.emaS + 1), aR: 1 / cfg.rsiN, aA: 1 / cfg.atrN,
            warm: Math.max(cfg.emaF, cfg.emaS, cfg.rsiN, cfg.atrN) * 3, riskAmt: cfg.bal * cfg.riskPct };
          const STATE = "state.json";
          const state = fs.existsSync(STATE) ? JSON.parse(fs.readFileSync(STATE, "utf8")) : {};
          const DEMO = E.DEMO === "1";

          function fetchDeriv(symbol) {
            return new Promise((resolve, reject) => {
              const ws = new WebSocket(E.DERIV_WS);
              const t = setTimeout(() => { try { ws.close(); } catch {} reject(new Error("Deriv timeout")); }, 25000);
              ws.addEventListener("open", () => ws.send(JSON.stringify({
                ticks_history: symbol, adjust_start_time: 1, count: cfg.count + 1,
                end: "latest", granularity: cfg.gran, style: "candles" })));
              ws.addEventListener("message", (m) => {
                clearTimeout(t); const r = JSON.parse(m.data); ws.close();
                if (r.error) return reject(new Error(r.error.message));
                resolve(r.candles.slice(0, -1).map(x => ({ t: x.epoch * 1000, o: x.open, h: x.high, l: x.low, c: x.close })));
              });
              ws.addEventListener("error", () => { clearTimeout(t); reject(new Error("WebSocket error")); });
            });
          }

          function demoCandles(n = 300) {
            let p = 1000; const out = [], t0 = Date.now() - cfg.gran * 1000 * n;
            for (let i = 0; i < n; i++) {
              const o = p; p = o + (Math.floor(i / 50) % 2 ? 0.1 : -0.1) + (Math.random() + Math.random() + Math.random() - 1.5) * 2.2;
              out.push({ t: t0 + i * cfg.gran * 1000, o, h: Math.max(o, p) + Math.random() * .9, l: Math.min(o, p) - Math.random() * .9, c: p });
            }
            return out;
          }

          // ---- the spreadsheet maths: one row per candle ----
          function compute(cs) {
            const rows = []; let prev = null;
            cs.forEach((k, i) => {
              const r = { ...k };
              if (!prev) { r.emaF = k.c; r.emaS = k.c; r.ag = 0; r.al = 0; r.tr = k.h - k.l; r.atr = r.tr; r.cross = 0; }
              else {
                const ch = k.c - prev.c;
                r.emaF = prev.emaF + st.aF * (k.c - prev.emaF);
                r.emaS = prev.emaS + st.aS * (k.c - prev.emaS);
                r.ag = prev.ag + st.aR * (Math.max(ch, 0) - prev.ag);
                r.al = prev.al + st.aR * (Math.max(-ch, 0) - prev.al);
                r.tr = Math.max(k.h - k.l, Math.abs(k.h - prev.c), Math.abs(k.l - prev.c));
                r.atr = prev.atr + st.aA * (r.tr - prev.atr);
              }
              const tot = r.ag + r.al; r.rsi = tot === 0 ? 50 : 100 * r.ag / tot;
              r.bar = i + 1; r.valid = r.bar > st.warm ? 1 : 0;
              if (prev) {
                if (r.valid !== 1) r.cross = 0;
                else if (prev.emaF <= prev.emaS && r.emaF > r.emaS) r.cross = 1;
                else if (prev.emaF >= prev.emaS && r.emaF < r.emaS) r.cross = -1;
                else r.cross = 0;
              }
              r.signal = "";
              if (r.cross === 1 && r.rsi >= st.buyLo && r.rsi <= st.buyHi) r.signal = "BUY";
              else if (r.cross === -1 && r.rsi >= st.sellLo && r.rsi <= st.sellHi) r.signal = "SELL";
              if (r.signal) {
                const d = r.atr * st.slM, s = r.signal === "BUY" ? 1 : -1;
                r.entry = k.c; r.sl = k.c - s * d; r.tp = k.c + s * d * st.rr; r.units = st.riskAmt / d;
              }
              rows.push(r); prev = r;
            });
            return rows;
          }

          const f2 = v => Number(v).toFixed(2);
          const fT = ms => new Date(ms).toISOString().slice(0, 16).replace("T", " ");
          const message = (sym, r) =>
            `${r.signal === "BUY" ? "🟢" : "🔴"} ${r.signal} ${sym} (${cfg.gran / 60}m)\nTime: ${fT(r.t)} UTC\nEntry: ${f2(r.entry)}\nSL: ${f2(r.sl)}\nTP: ${f2(r.tp)}\nRSI: ${r.rsi.toFixed(1)}  ATR: ${r.atr.toFixed(3)}\nSize: ${r.units.toFixed(2)} units (risk ${st.riskAmt.toFixed(2)})\n— FOCUS AUTO TRADERS (mechanical signal, not advice)`;

          async function send(text) {
            if (!E.TELEGRAM_TOKEN || !E.TELEGRAM_CHAT_ID) { console.log("[no Telegram secrets - printing only]\n" + text + "\n"); return; }
            const res = await fetch("https://api.telegram.org/bot" + E.TELEGRAM_TOKEN + "/sendMessage", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ chat_id: E.TELEGRAM_CHAT_ID, text }) });
            const j = await res.json(); if (!j.ok) throw new Error("Telegram: " + (j.description || res.status));
          }

          let failed = false;
          for (const sym of cfg.symbols) {
            try {
              const rows = compute(DEMO ? demoCandles() : await fetchDeriv(sym));
              const last = rows[rows.length - 1], key = sym + "_" + cfg.gran, lastSent = state[key] || 0;
              const fresh = rows.slice(-cfg.catchUp).filter(r => r.signal && r.t > lastSent);
              console.log(sym + " close=" + f2(last.c) + " rsi=" + last.rsi.toFixed(1) + " new_signals=" + fresh.length);
              for (const r of fresh) { await send(message(sym, r)); state[key] = r.t; }
            } catch (e) { console.error(sym + ": " + e.message); failed = true; }
          }
          if (!DEMO) fs.writeFileSync(STATE, JSON.stringify(state, null, 2) + "\n");
          if (failed) process.exit(1);
          BOT_EOF

      - name: Save state (prevents duplicate alerts)
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "signal-bot"
            git config user.email "signal-bot@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || (git commit -m "update state [skip ci]" && git pull --rebase -q && git push)
          fi
