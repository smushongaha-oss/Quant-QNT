<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QNT Lifetime — SNIPER logic</title>
<style>
:root{--bg:#03070c;--line:#123041;--cyan:#33d6ff;--red:#ff4d4d;--green:#3ddc84;--muted:#5f7d92}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#dff6ff;font-family:'Courier New',monospace}
.shell{padding:8px;display:grid;gap:8px;max-width:900px;margin:auto}
.p{background:#071018;border:1px solid var(--line);border-radius:10px;padding:10px}
h1{font-size:14px;margin:0;color:var(--green)}small{color:var(--muted);font-size:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.z{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center;font-size:11px;font-weight:800}
.z.BUY{color:var(--green);border-color:var(--green);background:rgba(61,220,132,.08)}.z.SELL{color:var(--red);border-color:var(--red);background:rgba(255,77,77,.08)}.z.NEUTRAL{color:var(--muted)}
.banner{border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center;font-weight:800;font-size:12px}
.banner.buy{color:var(--green);border-color:var(--green)}.banner.sell{color:var(--red);border-color:var(--red)}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:10px}
.lv div{border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center}
.e{color:var(--cyan);border-color:var(--cyan)!important}.s{color:var(--red);border-color:var(--red)!important}.t{color:var(--green);border-color:var(--green)!important}
.chart{height:240px;background:#040b12;border:1px solid var(--line);border-radius:6px}.chart svg{width:100%;height:100%}
table{width:100%;border-collapse:collapse;font-size:11px}td,th{padding:5px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:400}
input,button{background:#07141f;color:var(--cyan);border:1px solid #1a7a99;border-radius:8px;padding:8px;font:inherit;font-size:12px}
</style></head><body><div class="shell">
<div class="p"><h1>QNT LIFETIME — SNIPER structure logic</h1>
<small id="status">loading Binance QNTUSDT…</small></div>
<div class="p"><div class="grid3" id="zones"></div><div class="banner" id="banner" style="margin-top:8px">…</div></div>
<div class="p"><div class="chart"><svg id="chart" viewBox="0 0 400 240" preserveAspectRatio="none"></svg></div><small>Monthly closes, log scale. Dashed: Entry / SL / TP1.</small></div>
<div class="p"><div class="lv" id="levels"></div></div>
<div class="p"><b style="font-size:11px">LIFETIME STATS</b><table id="stats"></table></div>
<div class="p"><b style="font-size:11px">MARKET-CAP SCENARIOS</b> <small>(price = target cap ÷ supply)</small><br>
<small>Supply: <input id="supply" type="number" value="14612493" style="width:120px"></small>
<table id="scen"></table>
<small>Scenarios are arithmetic, not forecasts. They show what price a given market cap requires.</small></div>
</div>
<script>
const BASES=['https://api.binance.com','https://data-api.binance.vision'];
async function klines(interval,limit){
  for(const b of BASES){try{const r=await fetch(`${b}/api/v3/klines?symbol=QNTUSDT&interval=${interval}&limit=${limit}`);if(!r.ok)continue;const j=await r.json();return j.map(k=>({epoch:k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4]}))}catch(e){}}
  throw new Error('Binance unreachable');
}
function computeStructure(c,lb){const n=c.length;if(n<lb*2+3)return{state:0,barsSinceBos:999};const sw=[];for(let i=lb;i<n-lb;i++){let H=true,L=true;for(let k=1;k<=lb;k++){if(c[i].high<=c[i-k].high||c[i].high<=c[i+k].high)H=false;if(c[i].low>=c[i-k].low||c[i].low>=c[i+k].low)L=false;if(!H&&!L)break}if(H)sw.push({at:i+lb,t:'H',p:c[i].high});if(L)sw.push({at:i+lb,t:'L',p:c[i].low})}sw.sort((a,b)=>a.at-b.at);let lH=null,lL=null,state=0,bos=-1,ptr=0;for(let i=0;i<n;i++){while(ptr<sw.length&&sw[ptr].at<=i){const s=sw[ptr];if(s.t==='H')lH=s.p;else lL=s.p;ptr++}if(i>0){const cl=c[i].close;if(lL!==null&&cl<lL){state=-1;bos=i;lL=null}else if(lH!==null&&cl>lH){state=1;bos=i;lH=null}}}return{state,barsSinceBos:bos===-1?999:n-1-bos}}
function atr(c,p){if(c.length<p+1)return null;let s=0;for(let i=c.length-p;i<c.length;i++){const a=c[i],b=c[i-1];s+=Math.max(a.high-a.low,Math.abs(a.high-b.close),Math.abs(a.low-b.close))}return s/p}
function val(r,dec){if(!r||r.state===0)return 50;const b=Math.min(r.barsSinceBos,100);return r.state===1?Math.max(50,92-dec*b):Math.min(50,8+dec*b)}
function zone(v){return v>=60?'BUY':v<=40?'SELL':'NEUTRAL'}
const fmt=n=>n>=100?n.toFixed(2):n.toFixed(3);
const fmtCap=n=>n>=1e9?'$'+(n/1e9).toFixed(1)+'B':'$'+(n/1e6).toFixed(0)+'M';
(async()=>{
 try{
  const [M,W,D]=await Promise.all([klines('1M',200),klines('1w',500),klines('1d',500)]);
  const price=D[D.length-1].close;
  // lookbacks scaled for timeframe (v28 uses 20 on intraday; monthly has far fewer bars)
  const zM=zone(val(computeStructure(M,3),4)),zW=zone(val(computeStructure(W,5),2)),zD=zone(val(computeStructure(D,10),1.5));
  document.getElementById('zones').innerHTML=[['MONTHLY',zM],['WEEKLY',zW],['DAILY',zD]].map(([n,z])=>`<div class="z ${z}">${n}<br>${z}</div>`).join('');
  // direction: monthly first, else weekly (same "H4 leads" idea, one tier up)
  const lead=zM!=='NEUTRAL'?zM:zW,aligned=zM!=='NEUTRAL'&&zM===zW;
  const A=atr(W,14),lows=W.slice(-20).map(c=>c.low),highs=W.slice(-20).map(c=>c.high);
  const b=document.getElementById('banner');
  let entry=null,sl=null,tp1=null,tp2=null;
  if(lead==='NEUTRAL'){b.textContent='NEUTRAL — no swing, levels locked';}
  else{
   entry=price;
   if(lead==='BUY'){sl=Math.min(...lows)-A*0.8;tp1=entry+A*2.5;tp2=entry+A*4}else{sl=Math.max(...highs)+A*0.8;tp1=entry-A*2.5;tp2=entry-A*4}
   b.textContent=`SWING ${lead}`+(aligned?' — MONTHLY+WEEKLY ALIGNED':' — higher timeframe not fully aligned')+` @ ${fmt(price)}`;
   b.className='banner '+(lead==='BUY'?'buy':'sell');
  }
  document.getElementById('levels').innerHTML=entry?`<div class="e">Entry<br>${fmt(entry)}</div><div class="s">SL<br>${fmt(sl)}</div><div class="t">TP1<br>${fmt(tp1)}</div><div class="t">TP2<br>${fmt(tp2)}</div>`:`<div style="grid-column:1/-1;opacity:.4">No swing — wait</div>`;
  // chart
  const src=M.map(c=>c.close),all=src.concat([sl,tp1,entry].filter(x=>x)),mn=Math.log(Math.min(...all)),mx=Math.log(Math.max(...all)),y=p=>230-((Math.log(p)-mn)/(mx-mn))*215;
  let s=`<polyline fill="none" stroke="${lead==='SELL'?'#ff4d4d':'#3ddc84'}" stroke-width="1.5" points="${src.map((p,i)=>`${(i/(src.length-1))*400},${y(p).toFixed(1)}`).join(' ')}"/>`;
  [[entry,'#33d6ff'],[sl,'#ff4d4d'],[tp1,'#3ddc84']].forEach(([p,c])=>{if(p)s+=`<line x1="0" x2="400" y1="${y(p)}" y2="${y(p)}" stroke="${c}" stroke-width=".8" stroke-dasharray="4 4"/>`});
  document.getElementById('chart').innerHTML=s;
  // stats from daily+monthly history
  const ath=Math.max(...M.map(c=>c.high)),atl=Math.min(...M.map(c=>c.low));
  const athBar=M.find(c=>c.high===ath),first=M[0];
  const yr=D.slice(-365),ret=(a,n)=>D.length>n?((a/D[D.length-1-n].close-1)*100).toFixed(0)+'%':'—';
  const rows=[['Price',fmt(price)],['All-time high (Binance)',fmt(ath)+' · '+new Date(athBar.epoch*1000).toISOString().slice(0,7)],['All-time low',fmt(atl)],['Below ATH',((1-price/ath)*100).toFixed(1)+'%'],['Above ATL',((price/atl-1)*100).toFixed(0)+'%'],['30d / 90d / 365d',`${ret(price,30)} / ${ret(price,90)} / ${ret(price,365)}`],['Weekly ATR(14)',fmt(A)+' ('+(A/price*100).toFixed(1)+'% of price)'],['History loaded',`${M.length} months since ${new Date(first.epoch*1000).toISOString().slice(0,7)}`]];
  document.getElementById('stats').innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
  window._price=price;drawScen();
  document.getElementById('status').textContent='live · Binance QNTUSDT · '+new Date().toLocaleString();
 }catch(e){document.getElementById('status').textContent='❌ '+e.message+' — open this file in a browser that can reach Binance';}
})();
function drawScen(){
 const sup=+document.getElementById('supply').value||14612493,p=window._price;if(!p)return;
 const caps=[2e9,5e9,10e9,25e9,50e9,100e9];
 document.getElementById('scen').innerHTML='<tr><th>Market cap</th><th>Price</th><th>vs now</th></tr>'+caps.map(c=>{const t=c/sup;return `<tr><td>${fmtCap(c)}</td><td>${fmt(t)}</td><td style="color:${t>=p?'#3ddc84':'#ff4d4d'}">${((t/p-1)*100).toFixed(0)}%</td></tr>`}).join('')+`<tr><td>Now</td><td>${fmt(p)}</td><td>${fmtCap(p*sup)}</td></tr>`;
}
document.getElementById('supply').addEventListener('input',drawScen);
</script></body></html>
